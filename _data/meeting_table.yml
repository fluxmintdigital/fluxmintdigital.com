primary_verb: Collaborate
backend_configured: false
public_client_artifacts: false
attribution_assumed: false
implementation_automatic: false
stages:
  - id: describe
    label: Describe
    description: Begin with the real problem, opportunity, or decision as you understand it now.
  - id: clarify
    label: Clarify
    description: Identify the objective, context, constraints, unknowns, and people affected.
  - id: scope
    label: Scope
    description: Decide what this conversation needs to resolve and what should stay outside it.
  - id: decide
    label: Decide
    description: Choose guidance only, consider building something afterward, or decide another path is a better fit.
decisions:
  - id: architecture-only
    label: A clearer plan or guidance
    description: Leave with clearer structure and decisions, without committing to a build.
  - id: architecture-and-implementation
    label: Make a plan, then consider building
    description: Settle the direction first. Workshop work can be considered afterward, but it is never automatic.
  - id: no-engagement
    label: No engagement or not a fit
    description: A good outcome may be to pause, choose another path, or decide FluxMintDigital is not the right fit.
boundaries:
  - title: Clarity can be the outcome
    description: You may leave with clearer goals, constraints, a system map, a decision, or an agreed blueprint for possible future work.
  - title: Building is a separate decision
    description: Workshop work begins only after the direction, scope, expectations, and fit are clear to everyone.
  - title: Examination belongs at the Wall
    description: Questions that need formal evidence, confidence, and contradiction tracking belong on the Architecture Wall—not in a collaboration brief.
  - title: Privacy remains the default
    description: Collaborative work can remain private. Public credit such as “Powered by FluxMintDigital” happens only when everyone explicitly agrees.
