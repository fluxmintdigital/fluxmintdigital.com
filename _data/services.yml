- name: "Life Architecture"
  description: "A structured, compassionate, clarity-driven process for designing a life that fits. Clients learn to map cycles, patterns, drift, alignment, and direction."
- name: "Business Architecture"
  description: "A systems-thinking approach to designing businesses, workflows, teams, and operations — with structural maps, workflow diagrams, and clarity-based decision frameworks."
- name: "System Architecture"
  description: "High-level structural consulting for creators, founders, and engineers, using forces, layers, apertures, and stability modes."
- name: "App Architecture"
