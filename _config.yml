title: FluxMintDigital
description: FluxMintDigital is a Studio where curiosity explores hidden architecture through books, instruments, research, and things being built toward clearer understanding.
url: "https://fluxmintdigital.com"
baseurl: ""

# Progressive experience features. Explorer Entry remains intentionally still
# until a replacement delivery set has passed the production asset gate.
features:
  explorer_entry_idle:
    enabled: false
    asset_base: /assets/images/explorer-entry/idle/
    frame_count: 12

author:
  name: DJ Boswell

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

# Canonical Studio content. Artifact front matter is the authority for
# identity, classification, lifecycle, visibility, and availability.
collections:
  artifacts:
    output: true
    permalink: /artifacts/:name/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - script
  - FluxMintDigital_AAA_Asset_Master_Manifest.csv
  - FluxMintDigital_AAA_Remaining_Production_Checklist.md
  - FluxMintDigital_AAA_Treatment_Matrix.md
  - FluxMintDigital_Implementation_Readiness_Gaps.md
  - FluxMintDigital_Interactive_Object_Register.csv
  - FluxMintDigital_Mobile_Composition_Requirements.md
  - FluxMintDigital_Scene_Decomposition_Plan.md
  - FluxMintDigital_Experience_and_Interaction_Audit.md
  - FluxMintDigital_Website_Canonical_Package/Docs
  - FluxMintDigital_Website_Canonical_Package/Assets/archived
  - FluxMintDigital_Website_Canonical_Package/Assets/final/FMD_UI_*
  - FluxMintDigital_Website_Canonical_Package/Assets/final/FMD_SOURCE_*
