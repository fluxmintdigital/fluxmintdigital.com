# SEO
twitter:
  username: fluxmintdigital
social:
  name: FluxMintDigital

# Collections
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "DJ Boswell"
      artifact_type: "Essay"
      canonical_room: "observatory"
      lifecycle: "published"
      visibility: "public"
      governance: "canonical"
  - scope:
      path: ""
      type: "artifacts"
    values:
      layout: "artifact"
      governance: "canonical"
      visibility: "public"
  - scope:
      path: ""
    values:
      layout: "page"
