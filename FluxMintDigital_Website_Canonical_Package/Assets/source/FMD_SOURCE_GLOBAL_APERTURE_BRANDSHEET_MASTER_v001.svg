<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1320" viewBox="0 0 1200 1320">
  <defs>
    <linearGradient id="apertureGradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="wordmarkGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0D1117" flood-opacity=".12"/>
    </filter>

    <!-- Canonical Aperture mark geometry -->
    <symbol id="apertureMark" viewBox="0 0 200 200">
      <path d="M100 14 L100 62 L64 98 L16 98 Z" fill="currentColor"/>
      <path d="M186 98 L138 98 L102 62 L102 14 Z" fill="currentColor"/>
      <path d="M16 102 L64 102 L100 138 L100 186 Z" fill="currentColor"/>
      <path d="M102 186 L102 138 L138 102 L186 102 Z" fill="currentColor"/>
    </symbol>

    <symbol id="apertureMarkGradient" viewBox="0 0 200 200">
      <path d="M100 14 L100 62 L64 98 L16 98 Z" fill="url(#apertureGradient)"/>
      <path d="M186 98 L138 98 L102 62 L102 14 Z" fill="url(#apertureGradient)"/>
      <path d="M16 102 L64 102 L100 138 L100 186 Z" fill="url(#apertureGradient)"/>
      <path d="M102 186 L102 138 L138 102 L186 102 Z" fill="url(#apertureGradient)"/>
    </symbol>

    <style>
      .ink { fill:#0D1117; }
      .slate { fill:#6B7280; }
      .blue { fill:#2563EB; }
      .purple { fill:#7C3AED; }
      .mist { fill:#E5E7EB; }
      .section { font:700 16px Arial, Helvetica, sans-serif; letter-spacing:.04em; fill:#2230C8; }
      .body { font:400 15px Arial, Helvetica, sans-serif; fill:#0D1117; }
      .small { font:400 12px Arial, Helvetica, sans-serif; fill:#374151; }
      .tiny { font:400 11px Arial, Helvetica, sans-serif; fill:#4B5563; }
    </style>
  </defs>

  <!-- White canvas -->
  <rect width="1200" height="1320" fill="#FFFFFF"/>

  <!-- Header -->
  <use href="#apertureMarkGradient" x="52" y="48" width="210" height="210"/>
  <text x="310" y="145" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" fill="#0D1117">
    FluxMint<tspan fill="url(#wordmarkGradient)">Digital</tspan>
  </text>
  <text x="312" y="210" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing=".09em" fill="#6B7280">
    ARCHITECTURE FOR MINDS, SYSTEMS, STORIES, TOOLS, AND APPS
  </text>

  <line x1="312" y1="280" x2="485" y2="280" stroke="#2563EB" stroke-width="2"/>
  <text x="600" y="289" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing=".12em" fill="#2230C8">
    THE APERTURE
  </text>
  <line x1="715" y1="280" x2="890" y2="280" stroke="#7C3AED" stroke-width="2"/>

  <text x="600" y="332" text-anchor="middle" class="body">
    An opening through which hidden architecture is revealed.
  </text>
  <text x="600" y="360" text-anchor="middle" class="body">
    Different perspectives. Deeper understanding.
  </text>

  <!-- Variant panel -->
  <rect x="30" y="404" width="1140" height="250" rx="18" fill="#F8FAFC"/>
  <text x="138" y="438" text-anchor="middle" class="section">PRIMARY MARK</text>
  <text x="362" y="438" text-anchor="middle" class="section">MONOCHROME</text>
  <text x="587" y="438" text-anchor="middle" class="section">REVERSED</text>
  <text x="815" y="438" text-anchor="middle" class="section">APP ICON</text>
  <text x="1040" y="438" text-anchor="middle" class="section">FAVICON</text>

  <!-- Primary -->
  <use href="#apertureMarkGradient" x="75" y="460" width="130" height="130"/>

  <!-- Mono -->
  <g color="#0D1117">
    <use href="#apertureMark" x="298" y="460" width="130" height="130"/>
  </g>

  <!-- Reversed -->
  <rect x="520" y="452" width="135" height="135" rx="26" fill="#0D1117"/>
  <g color="#FFFFFF">
    <use href="#apertureMark" x="538" y="470" width="99" height="99"/>
  </g>

  <!-- App icon -->
  <g filter="url(#softShadow)">
    <rect x="747" y="452" width="136" height="136" rx="27" fill="#FFFFFF"/>
  </g>
  <use href="#apertureMarkGradient" x="768" y="473" width="94" height="94"/>

  <!-- Favicon -->
  <use href="#apertureMarkGradient" x="1005" y="492" width="70" height="70"/>

  <line x1="250" y1="452" x2="250" y2="590" stroke="#E5E7EB"/>
  <line x1="475" y1="452" x2="475" y2="590" stroke="#E5E7EB"/>
  <line x1="700" y1="452" x2="700" y2="590" stroke="#E5E7EB"/>
  <line x1="925" y1="452" x2="925" y2="590" stroke="#E5E7EB"/>

  <!-- Meaning / construction -->
  <text x="60" y="706" class="section">MEANING</text>
  <text x="72" y="746" class="body">◆  Multiple perspectives</text>
  <text x="72" y="777" class="body">◆  Hidden structure</text>
  <text x="72" y="808" class="body">◆  Clarity through exploration</text>
  <text x="72" y="839" class="body">◆  The moment of discovery</text>

  <g transform="translate(340,690)">
    <polygon points="50,0 100,50 50,100 0,50" fill="none" stroke="#374151" stroke-width="3"/>
    <text x="50" y="132" text-anchor="middle" class="small">Perspective</text>
  </g>
  <text x="475" y="748" font-family="Arial" font-size="42" fill="#374151">+</text>

  <g transform="translate(520,690)">
    <path d="M50 0 L100 50 L50 100 L0 50 Z" fill="none" stroke="#374151" stroke-width="3"/>
    <path d="M48 100 L42 108" stroke="#FFFFFF" stroke-width="9"/>
    <text x="50" y="132" text-anchor="middle" class="small">Opening</text>
  </g>
  <text x="655" y="748" font-family="Arial" font-size="42" fill="#374151">=</text>

  <use href="#apertureMarkGradient" x="700" y="682" width="110" height="110"/>
  <text x="755" y="822" text-anchor="middle" class="small">Revealed Architecture</text>

  <line x1="890" y1="685" x2="890" y2="845" stroke="#E5E7EB"/>
  <text x="935" y="706" class="section">PRINCIPLE</text>
  <text x="935" y="748" class="body">We don’t add more.</text>
  <text x="935" y="780" class="body">We change the aperture.</text>
  <text x="935" y="812" class="body">And suddenly,</text>
  <text x="935" y="844" class="body">the architecture appears.</text>

  <!-- Usage -->
  <text x="600" y="902" text-anchor="middle" class="section">USAGE EXAMPLES</text>
  <rect x="30" y="925" width="1140" height="165" rx="18" fill="#F8FAFC"/>

  <g transform="translate(68,955)">
    <text x="60" y="-12" text-anchor="middle" class="small">ON HAT</text>
    <rect x="6" y="10" width="108" height="80" rx="36" fill="#111827"/>
    <use href="#apertureMarkGradient" x="43" y="28" width="36" height="36"/>
  </g>

  <g transform="translate(250,950)">
    <text x="68" y="-7" text-anchor="middle" class="small">ON CLIPBOARD</text>
    <rect x="12" y="10" width="112" height="94" rx="10" fill="#B78350"/>
    <rect x="48" y="2" width="40" height="17" rx="5" fill="#6B7280"/>
    <use href="#apertureMarkGradient" x="50" y="34" width="36" height="36"/>
  </g>

  <g transform="translate(430,950)">
    <text x="70" y="-7" text-anchor="middle" class="small">ON NOTEBOOK</text>
    <rect x="18" y="10" width="104" height="94" rx="8" fill="#1E293B"/>
    <use href="#apertureMarkGradient" x="52" y="38" width="36" height="36"/>
  </g>

  <g transform="translate(610,950)">
    <text x="72" y="-7" text-anchor="middle" class="small">APP ICON USAGE</text>
    <rect x="20" y="10" width="104" height="94" rx="21" fill="#0D1117"/>
    <rect x="35" y="25" width="74" height="64" rx="15" fill="#FFFFFF"/>
    <use href="#apertureMarkGradient" x="50" y="38" width="44" height="44"/>
  </g>

  <g transform="translate(790,950)">
    <text x="70" y="-7" text-anchor="middle" class="small">ON BOOK SPINE</text>
    <rect x="28" y="10" width="84" height="94" rx="5" fill="#172033"/>
    <use href="#apertureMarkGradient" x="53" y="24" width="34" height="34"/>
    <text x="70" y="75" text-anchor="middle" font-family="Arial" font-size="8" fill="#FFFFFF">ARCHITECTURE</text>
  </g>

  <g transform="translate(968,950)">
    <text x="74" y="-7" text-anchor="middle" class="small">ON WEBSITE</text>
    <rect x="0" y="10" width="148" height="94" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
    <use href="#apertureMarkGradient" x="14" y="40" width="28" height="28"/>
    <text x="50" y="59" font-family="Arial" font-size="11" font-weight="700" fill="#0D1117">FluxMint<tspan fill="#5B4CF0">Digital</tspan></text>
  </g>

  <!-- Palette -->
  <text x="45" y="1150" class="section">COLOR PALETTE</text>

  <g transform="translate(165,1170)">
    <rect width="42" height="42" rx="4" fill="#0D1117"/>
    <text x="21" y="64" text-anchor="middle" class="tiny">Ink</text>
    <text x="21" y="80" text-anchor="middle" class="tiny">#0D1117</text>
  </g>

  <g transform="translate(255,1170)">
    <rect width="42" height="42" rx="4" fill="#2563EB"/>
    <text x="21" y="64" text-anchor="middle" class="tiny">Flux Blue</text>
    <text x="21" y="80" text-anchor="middle" class="tiny">#2563EB</text>
  </g>

  <g transform="translate(345,1170)">
    <rect width="42" height="42" rx="4" fill="#7C3AED"/>
    <text x="21" y="64" text-anchor="middle" class="tiny">Flux Purple</text>
    <text x="21" y="80" text-anchor="middle" class="tiny">#7C3AED</text>
  </g>

  <g transform="translate(435,1170)">
    <rect width="42" height="42" rx="4" fill="#6B7280"/>
    <text x="21" y="64" text-anchor="middle" class="tiny">Slate</text>
    <text x="21" y="80" text-anchor="middle" class="tiny">#6B7280</text>
  </g>

  <g transform="translate(525,1170)">
    <rect width="42" height="42" rx="4" fill="#E5E7EB" stroke="#D1D5DB"/>
    <text x="21" y="64" text-anchor="middle" class="tiny">Mist</text>
    <text x="21" y="80" text-anchor="middle" class="tiny">#E5E7EB</text>
  </g>

  <g transform="translate(615,1170)">
    <rect width="42" height="42" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="21" y="64" text-anchor="middle" class="tiny">White</text>
    <text x="21" y="80" text-anchor="middle" class="tiny">#FFFFFF</text>
  </g>

  <!-- Clear space -->
  <text x="790" y="1150" class="section">CLEAR SPACE</text>
  <g transform="translate(845,1174)">
    <rect x="0" y="0" width="92" height="92" fill="none" stroke="#E5E7EB"/>
    <line x1="30" y1="0" x2="30" y2="92" stroke="#E5E7EB"/>
    <line x1="62" y1="0" x2="62" y2="92" stroke="#E5E7EB"/>
    <line x1="0" y1="30" x2="92" y2="30" stroke="#E5E7EB"/>
    <line x1="0" y1="62" x2="92" y2="62" stroke="#E5E7EB"/>
    <use href="#apertureMarkGradient" x="27" y="27" width="38" height="38"/>
    <text x="46" y="-5" text-anchor="middle" class="tiny">X</text>
    <text x="46" y="108" text-anchor="middle" class="tiny">X</text>
    <text x="-7" y="49" text-anchor="middle" class="tiny">X</text>
    <text x="99" y="49" text-anchor="middle" class="tiny">X</text>
  </g>

  <text x="960" y="1192" class="small">Clear space around the mark</text>
  <text x="960" y="1212" class="small">ensures legibility and impact.</text>
  <text x="960" y="1232" class="small">Use at least “X” on all sides.</text>

  <!-- Footer metadata -->
  <line x1="45" y1="1290" x2="1155" y2="1290" stroke="#E5E7EB"/>
  <text x="45" y="1310" class="tiny">FluxMintDigital Aperture Brand Sheet · Canonical Vector Master v1.0</text>
  <text x="1155" y="1310" text-anchor="end" class="tiny">Source-derived from approved brand-sheet reference</text>
</svg>
