{% assign dj = site.data.studio.owner %}
<section class="dj-scene" aria-labelledby="dj-scene-heading">
  <div class="dj-scene__viewport">
    <picture class="dj-scene__picture">
      <source media="(max-width: 767px)" srcset="{{ '/FluxMintDigital_Website_Canonical_Package/Assets/final/FMD_SCENE_MEETDJ_LIKENESS_MOBILE_DEFAULT_v003.webp' | relative_url }}" width="941" height="1672" type="image/webp">
      <img src="{{ '/FluxMintDigital_Website_Canonical_Package/Assets/final/FMD_SCENE_MEETDJ_LIKENESS_DESKTOP_DEFAULT_v003.webp' | relative_url }}" width="1672" height="941" alt="An art-styled portrait of DJ in a warm timber workspace with books, cameras, and his animals." fetchpriority="high">
    </picture>
    <div class="dj-scene__shade" aria-hidden="true"></div>
    <header class="dj-scene__identity">
      <p class="semantic-kicker">Author · Builder · Collaborator</p>
      <h1 id="dj-scene-heading">Meet {{ dj.public_name }}</h1>
      <p>The person behind the books, tools, ideas, and collaborations inside FluxMintDigital.</p>
    </header>
    <a class="dj-scene__return" href="{{ '/studio/' | relative_url }}"><span aria-hidden="true">◆</span><span><strong>Main Studio</strong><small>Return</small></span></a>
  </div>
  <p class="scene-context container">A glimpse of the workspace—and an introduction to the person behind it.</p>
</section>
