<!-- Add your Google Search Console verification tag for fluxmintdigital.com here, e.g.:
<meta name="google-site-verification" content="YOUR-CODE-HERE" />
(The verification code from fluxmintdigital.github.io only works for that domain, so it isn't included here.) -->
<meta name="author" content="DJ Boswell">
<meta property="og:site_name" content="FluxMintDigital">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "FluxMintDigital",
  "url": "{{ site.url }}",
  "description": "{{ site.description }}",
  "founder": {
    "@type": "Person",
    "name": "DJ Boswell"
  }
}
</script>
